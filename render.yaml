services:
  - type: web
    name: workflow-ai-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: workflow-documents
      - key: CORS_ORIGINS
        value: http://localhost:3000
      - key: DEMO_MODE
        value: "false"
      - key: MAX_FILE_SIZE_MB
        value: "10"
      - key: MAX_DOCUMENTS_PER_USER
        value: "5"
      - key: MAX_CHAT_REQUESTS_PER_DAY
        value: "20"
      - key: MAX_REPORTS_PER_DAY
        value: "5"
      - key: EMBEDDING_DIM
        value: "384"
